[package]
name = "bc-lifehash"
version = "0.1.0"
edition = "2024"
description = "LifeHash visual hashing algorithm"
authors = ["Blockchain Commons"]
repository = "https://github.com/BlockchainCommons/bc-lifehash-rust"
license = "BSD-2-Clause-Patent"
documentation = "https://docs.rs/bc-lifehash"
keywords = ["lifehash", "visual-hash"]
categories = ["algorithms"]

[dependencies]
sha2 = "^0.10.6"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
hex = "^0.4.3"
